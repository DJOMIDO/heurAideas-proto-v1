services:
  # ========== PostgreSQL Database ==========
  db:
    image: postgres:15-alpine
    container_name: aideas-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aideas_db
    network_mode: host
    command: postgres -p 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aideas_db -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== pgAdmin 4 (Optional) ==========
  pgadmin:
    image: dpage/pgadmin4
    container_name: aideas-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ========== FastAPI Backend ==========
  backend:
    build:
      context: ./backend
      network: host
    container_name: heuraideas-backend
    network_mode: host
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://user:password@localhost:5433/aideas_db
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}"
    depends_on:
      db:
        condition: service_healthy

  # ========== Nginx Frontend ==========
  frontend:
    image: nginx:alpine
    container_name: heuraideas-nginx
    network_mode: host
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data: {}
  pgadmin_data: {}